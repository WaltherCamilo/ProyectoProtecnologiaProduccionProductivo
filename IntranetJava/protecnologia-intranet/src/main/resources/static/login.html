<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Acceso | ProTecnologiaTech</title>


    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">


    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


    <style>

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }


        body {

            min-height: 100vh;

            font-family: 'Poppins', sans-serif;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #021526,
                    #03346e,
                    #021526
                );

            display: flex;

            flex-direction: column;

        }


        /* =====================================================
           NAVBAR
           ===================================================== */

        .navbar {

            height: 76px;

            padding: 0 40px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background:
                linear-gradient(
                    90deg,
                    #020d2b,
                    #06447f
                );

            box-shadow:
                0 3px 14px
                rgba(0,0,0,.35);

        }


        .logo {

            display: flex;

            align-items: center;

            gap: 12px;

            color: white;

            text-decoration: none;

        }


        .logo img {

            width: 44px;

            height: 44px;

            background: white;

            padding: 3px;

            object-fit: contain;

        }


        .logo span {

            font-size: 21px;

            font-weight: 700;

        }


        .back {

            color: white;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;

        }


        .back:hover {

            color: #0bd5f7;

        }


        /* =====================================================
           CONTENIDO
           ===================================================== */

        .content {

            flex: 1;

            width: 92%;

            max-width: 1050px;

            margin: auto;

            padding: 65px 0;

            display: grid;

            grid-template-columns:
                1fr 420px;

            gap: 60px;

            align-items: center;

        }


        /* =====================================================
           EXPLICACIÓN
           ===================================================== */

        .description {

            padding-right: 20px;

        }


        .icon {

            width: 68px;

            height: 68px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #096fb7;

            border-radius: 12px;

            margin-bottom: 25px;

        }


        .icon i {

            font-size: 30px;

        }


        .description h1 {

            font-size: 37px;

            line-height: 1.2;

            margin-bottom: 15px;

        }


        .line {

            width: 60px;

            height: 4px;

            background: #0bd5f7;

            margin-bottom: 20px;

        }


        .description p {

            color: #c7dced;

            font-size: 14px;

            line-height: 1.9;

        }


        .security {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-top: 25px;

            color: #0bd5f7;

            font-size: 12px;

        }


        /* =====================================================
           LOGIN
           ===================================================== */

        .login-card {

            padding: 35px;

            background:
                linear-gradient(
                    145deg,
                    #174e8b,
                    #103a68
                );

            border:
                1px solid
                rgba(11,213,247,.25);

            border-radius: 15px;

            box-shadow:
                0 12px 35px
                rgba(0,0,0,.30);

        }


        .login-card h2 {

            font-size: 23px;

            margin-bottom: 5px;

        }


        .login-subtitle {

            color: #bcd2e7;

            font-size: 12px;

            margin-bottom: 25px;

        }


        .field {

            margin-bottom: 18px;

        }


        .field label {

            display: block;

            margin-bottom: 7px;

            font-size: 12px;

            font-weight: 600;

        }


        .input-box {

            position: relative;

        }


        .input-box i {

            position: absolute;

            left: 14px;

            top: 50%;

            transform:
                translateY(-50%);

            color: #0bd5f7;

        }


        .input-box input {

            width: 100%;

            height: 46px;

            padding:
                0 15px 0 42px;

            border: 1px solid
                rgba(255,255,255,.15);

            border-radius: 5px;

            outline: none;

            background:
                #092e53;

            color: white;

            font-family: 'Poppins', sans-serif;

            font-size: 12px;

        }


        .input-box input:focus {

            border-color: #0bd5f7;

        }


        .input-box input::placeholder {

            color: #7893aa;

        }


        .login-button {

            width: 100%;

            height: 46px;

            margin-top: 8px;

            border: none;

            border-radius: 4px;

            background: #0bd0ef;

            color: #012235;

            font-family: 'Poppins', sans-serif;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

        }


        .login-button:hover {

            background: #27dcf5;

        }


        .error {

            display: none;

            margin-top: 15px;

            padding: 10px;

            background:
                rgba(180,30,30,.25);

            border:
                1px solid
                rgba(255,80,80,.35);

            border-radius: 4px;

            color: #ffd4d4;

            font-size: 11px;

        }


        .register {

            margin-top: 20px;

            text-align: center;

            font-size: 11px;

            color: #a9c0d5;

        }


        .register a {

            color: #0bd5f7;

            text-decoration: none;

        }


        /* =====================================================
           FOOTER
           ===================================================== */

        footer {

            padding: 22px;

            text-align: center;

            background: #020d25;

            color: #8099af;

            font-size: 10px;

        }


        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media(max-width:800px) {

            .content {

                grid-template-columns: 1fr;

                max-width: 500px;

            }


            .description {

                text-align: center;

                padding: 0;

            }


            .icon,
            .line {

                margin-left: auto;

                margin-right: auto;

            }


            .description h1 {

                font-size: 30px;

            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     NAVBAR
     ========================================================= -->

<header class="navbar">


    <a
        href="index.html"
        class="logo">

        <img
            src="Images/Logo.png"
            alt="ProTecnologiaTech">

        <span>
            ProTecnologiaTech
        </span>

    </a>


    <a
        href="panel.html"
        class="back">

        <i class="fas fa-arrow-left"></i>

        Volver al Dashboard

    </a>

</header>


<!-- =========================================================
     CONTENIDO
     ========================================================= -->

<main class="content">


    <!-- =====================================================
         EXPLICACIÓN DEL ÁREA
         ===================================================== -->

    <section class="description">


        <div class="icon">

            <i
                id="areaIcon"
                class="fas fa-building">
            </i>

        </div>


        <h1 id="areaTitle">
            Acceso al área
        </h1>


        <div class="line"></div>


        <p id="areaDescription">

            Inicie sesión para acceder a los
            servicios internos de ProTecnologiaTech.

        </p>


        <div class="security">

            <i class="fas fa-shield-halved"></i>

            Acceso protegido para usuarios autorizados.

        </div>

    </section>


    <!-- =====================================================
         LOGIN
         ===================================================== -->

    <section class="login-card">


        <h2>
            Iniciar sesión
        </h2>


        <p class="login-subtitle"
           id="loginSubtitle">

            Ingrese sus credenciales.

        </p>


        <form
            id="loginForm">


            <!-- CORREO -->

            <div class="field">

                <label for="correo">

                    Correo electrónico

                </label>


                <div class="input-box">

                    <i class="fas fa-envelope"></i>

                    <input
                        type="email"
                        id="correo"
                        placeholder="correo@empresa.com"
                        required>

                </div>

            </div>


            <!-- CONTRASEÑA -->

            <div class="field">

                <label for="password">

                    Contraseña

                </label>


                <div class="input-box">

                    <i class="fas fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Ingrese su contraseña"
                        required>

                </div>

            </div>


            <button
                type="submit"
                class="login-button"
                id="loginButton">

                <i class="fas fa-right-to-bracket"></i>

                Ingresar

            </button>


            <div
                class="error"
                id="error">

            </div>


        </form>


        <div class="register">

            ¿No tiene una cuenta?

            <a href="register.html">
                Registrarse
            </a>

        </div>


    </section>

</main>


<footer>

    © 2026 ProTecnologiaTech · Acceso seguro

</footer>


<script>


/* =========================================================
   ÁREA SELECCIONADA
   ========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const area =
    params.get("area") || "intranet";


/* =========================================================
   CONFIGURACIÓN DE ÁREAS
   ========================================================= */

const areas = {


    entornos: {

        title:
            "Entornos de desarrollo",

        description:
            "Área destinada a la gestión de ambientes de desarrollo, pruebas y despliegue de aplicaciones.",

        icon:
            "fas fa-code"

    },


    sql: {

        title:
            "SQL",

        description:
            "Área destinada a la administración, consulta y gestión de bases de datos y servicios SQL.",

        icon:
            "fas fa-database"

    },


    servidores: {

        title:
            "Servidores",

        description:
            "Área destinada a la administración de servidores, infraestructura y servicios tecnológicos.",

        icon:
            "fas fa-server"

    },


    intranet: {

        title:
            "Intranet interna",

        description:
            "Área privada para empleados. Aquí podrá consultar y gestionar servicios laborales de la compañía.",

        icon:
            "fas fa-building"

    },


    qa: {

        title:
            "QA",

        description:
            "Área destinada a pruebas, validación, seguimiento y control de calidad de las aplicaciones.",

        icon:
            "fas fa-vial"

    },


    normatividad: {

        title:
            "Normatividad",

        description:
            "Área destinada a la consulta y gestión de políticas, procedimientos y documentación normativa.",

        icon:
            "fas fa-scale-balanced"

    },


    calidad: {

        title:
            "Calidad",

        description:
            "Área destinada a la gestión de procesos, documentación y controles relacionados con calidad.",

        icon:
            "fas fa-award"

    }

};


const selected =
    areas[area] || areas.intranet;


/* =========================================================
   MOSTRAR ÁREA
   ========================================================= */

document.getElementById(
    "areaTitle"
).textContent =
    selected.title;


document.getElementById(
    "areaDescription"
).textContent =
    selected.description;


document.getElementById(
    "loginSubtitle"
).textContent =
    "Ingrese sus credenciales para acceder a " +
    selected.title;


document.getElementById(
    "areaIcon"
).className =
    selected.icon;


/* =========================================================
   LOGIN
   ========================================================= */

const form =
    document.getElementById(
        "loginForm"
    );


const errorBox =
    document.getElementById(
        "error"
    );


const button =
    document.getElementById(
        "loginButton"
    );


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const correo =
            document.getElementById(
                "correo"
            ).value.trim();


        const password =
            document.getElementById(
                "password"
            ).value;


        errorBox.style.display =
            "none";


        button.disabled =
            true;


        button.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> Ingresando...';


        try {


            const response =
                await fetch(
                    "/api/auth/login",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                correo:
                                    correo,

                                password:
                                    password

                            })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.mensaje ||
                    data.message ||
                    "Correo o contraseña incorrectos."
                );

            }


            /* =============================================
               GUARDAR SESIÓN
               ============================================= */

            if (!data.token) {

                throw new Error(
                    "El servidor no devolvió el token de acceso."
                );

            }


            localStorage.setItem(
                "token",
                data.token
            );


            if (data.usuario) {

                localStorage.setItem(
                    "user",
                    JSON.stringify(
                        data.usuario
                    )
                );

            }
            else if (data.user) {

                localStorage.setItem(
                    "user",
                    JSON.stringify(
                        data.user
                    )
                );

            }


            /* =============================================
               RECORDAR ÁREA
               ============================================= */

            localStorage.setItem(
                "areaActual",
                area
            );


            /* =============================================
               ENTRAR
               ============================================= */

            window.location.href =
                "panel.html";


        }
        catch(error) {

            console.error(error);


            errorBox.textContent =
                error.message ||
                "No fue posible iniciar sesión.";


            errorBox.style.display =
                "block";


            button.disabled =
                false;


            button.innerHTML =
                '<i class="fas fa-right-to-bracket"></i> Ingresar';

        }

    }
);


</script>


</body>

</html>
